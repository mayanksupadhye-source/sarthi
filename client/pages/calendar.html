<!doctype html>
<html lang="en">
  <head>
    <script src="../assets/js/route-guard.js"></script>

<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar — SARTHI (सारथी)</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../assets/css/variables.css" />
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/typography.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <style>
      .calendar-scroll {
        width: 100%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        min-width: 700px;
        width: 100%;
        box-sizing: border-box;
        gap: 1px;
        background-color: var(--color-border);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .cal-header-cell {
        background-color: var(--color-bg-base);
        padding: var(--space-2) var(--space-3);
        text-align: center;
        font-weight: 700;
        font-size: 0.75rem;
        color: var(--color-muted);
        text-transform: uppercase;
        min-width: 0;
      }
      .cal-day-cell {
        background-color: var(--color-bg-paper);
        min-width: 0;
        min-height: 105px;
        max-height: 165px;
        overflow-y: auto;
        padding: var(--space-2);
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-sizing: border-box;
      }
      .cal-day-cell.other-month {
        background-color: var(--color-bg-base);
        opacity: 0.5;
      }
      .cal-day-cell.today {
        background-color: #fffbeb;
        border: 1px solid #fcd34d;
      }
      .cal-date-num {
        font-weight: 700;
        font-size: 0.8125rem;
        color: var(--color-ink);
        margin-bottom: 2px;
      }
      .cal-event-pill {
        font-size: 0.7rem;
        padding: 2px 4px;
        border-radius: 2px;
        background-color: var(--color-bg-subtle);
        border-left: 2px solid var(--color-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        display: block;
        box-sizing: border-box;
      }
      .cal-event-pill.p1 {
        border-left-color: var(--color-p1);
        background-color: var(--color-p1-bg);
        color: var(--color-p1);
      }
      .cal-event-pill.exam {
        border-left-color: #dc2626;
        background-color: #fee2e2;
        color: #991b1b;
        font-weight: 700;
      }
      .cal-event-pill.exam-prep {
        border-left-color: #ea580c;
        background-color: #ffedd5;
        color: #9a3412;
        font-weight: 600;
      }
      .cal-event-pill.assignment {
        border-left-color: #7c3aed;
        background-color: #f5f3ff;
        color: #6d28d9;
        font-weight: 600;
      }
      .cal-event-pill.slack {
        border-left-color: #059669;
        background-color: #ecfdf5;
        color: #047857;
        font-weight: 600;
      }
      @media (max-width: 768px) {
        .calendar-grid {
          min-width: 0;
        }
        .cal-header-cell {
          padding: 6px 2px;
          font-size: 0.6rem;
        }
        .cal-day-cell {
          min-height: 68px;
          max-height: 105px;
          padding: 4px 3px;
        }
        .cal-event-pill {
          font-size: 0.58rem;
          padding: 1px 3px;
        }
        .month-target-bar {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          gap: 10px !important;
          padding: 12px !important;
        }
        .inspector-item {
          flex-direction: column;
          align-items: flex-start !important;
          gap: 6px;
        }
      }
      @media (max-width: 420px) {
        .cal-day-cell {
          min-height: 54px;
          max-height: 82px;
          padding: 3px 2px;
        }
        .cal-date-num {
          font-size: 0.72rem;
        }
      }
      .cal-event-pill.holiday {
        border-left-color: #2563eb;
        background-color: #eff6ff;
        color: #1d4ed8;
        font-weight: 600;
      }
      .cal-event-pill.lecture {
        border-left-color: #0284c7;
        background-color: #f0f9ff;
        color: #0369a1;
        font-weight: 600;
      }
      .cal-event-pill.hackathon {
        border-left-color: #9333ea;
        background-color: #faf5ff;
        color: #7e22ce;
        font-weight: 700;
      }
      .cal-day-cell {
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .cal-day-cell:hover {
        background-color: #f8fafc;
      }
      .cal-day-cell.selected-day {
        background-color: #f0fdf4 !important;
        border: 2px solid #16a34a !important;
        box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.25);
      }
      .month-target-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: var(--space-4);
        padding: var(--space-4);
        background: var(--color-bg-paper);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-4);
        box-shadow: var(--shadow-sm);
      }
      .target-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .target-stat-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--color-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .target-stat-val {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--color-ink);
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .target-stat-sub {
        font-size: 0.75rem;
        color: var(--color-muted);
        font-weight: normal;
      }
      .progress-bar-container {
        height: 6px;
        background: var(--color-bg-subtle);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
      }
      .progress-bar-fill {
        height: 100%;
        background: var(--color-primary);
        border-radius: 999px;
        transition: width 0.3s ease;
      }
      .inspector-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-bg-paper);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <main class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
            <div class="page-headline">Monthly Execution Calendar</div>
          </div>
          <div class="topbar-right">
            <div id="topbarFocusWidget"></div>
          </div>
        </header>

        <div class="page-container">
          <!-- Month Navigation -->
          <div
            class="card-header"
            style="border: none; padding: 0; margin-bottom: var(--space-4)"
          >
            <div
              style="display: flex; align-items: center; gap: var(--space-4)"
            >
              <button id="prevMonthBtn" class="btn btn-outline btn-sm">
                ← Prev
              </button>
              <h2 id="currentMonthYearLabel" style="font-size: 1.25rem">
                November 2026
              </h2>
              <button id="nextMonthBtn" class="btn btn-outline btn-sm">
                Next →
              </button>
            </div>
            <button id="todayBtn" class="btn btn-outline btn-sm">
              Jump to Today
            </button>
          </div>

          <!-- Whole Month Target Summary Bar -->
          <div id="monthTargetSummaryBar" class="month-target-bar" style="display: none;">
            <div class="target-stat">
              <span class="target-stat-label">📚 Lectures Target</span>
              <div class="target-stat-val">
                <span id="targetSummaryLectures">0 / 0</span>
                <span class="target-stat-sub" id="targetSummaryLecturesPct">(0%)</span>
              </div>
              <div class="progress-bar-container">
                <div class="progress-bar-fill" id="targetSummaryLecturesBar" style="width: 0%;"></div>
              </div>
            </div>

            <div class="target-stat">
              <span class="target-stat-label">⏱️ Study Hours</span>
              <div class="target-stat-val">
                <span id="targetSummaryHours">0h / 0h</span>
                <span class="target-stat-sub" id="targetSummaryHoursPct">(0%)</span>
              </div>
              <div class="progress-bar-container">
                <div class="progress-bar-fill" id="targetSummaryHoursBar" style="width: 0%; background: #0284c7;"></div>
              </div>
            </div>

            <div class="target-stat">
              <span class="target-stat-label">🎯 Active Tracks</span>
              <div class="target-stat-val">
                <span id="targetSummaryCourses">0</span>
                <span class="target-stat-sub">in progress</span>
              </div>
              <div class="text-xs text-muted" style="margin-top: 4px;" id="targetSummaryStatusNote">
                Pacing balanced with exams & rest days
              </div>
            </div>
          </div>

          <!-- Calendar Month Grid -->
          <div
            class="calendar-scroll"
            role="region"
            aria-label="Scrollable monthly calendar"
          >
            <div class="calendar-grid" id="calendarGrid">
              <div class="cal-header-cell">Sun</div>
              <div class="cal-header-cell">Mon</div>
              <div class="cal-header-cell">Tue</div>
              <div class="cal-header-cell">Wed</div>
              <div class="cal-header-cell">Thu</div>
              <div class="cal-header-cell">Fri</div>
              <div class="cal-header-cell">Sat</div>
            </div>
          </div>

          <!-- Interactive Day Schedule Inspector -->
          <div class="card" id="dayScheduleInspector" style="margin-top: var(--space-6); display: none;">
            <div
              class="card-header"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--space-3);
                border-bottom: 1px solid var(--color-border);
                padding-bottom: var(--space-3);
              "
            >
              <div>
                <div style="display: flex; align-items: center; gap: var(--space-2);">
                  <h3 id="inspectorDateHeading" style="margin: 0; font-size: 1.125rem;">Schedule for ...</h3>
                  <div id="inspectorBadges" style="display: flex; gap: 4px; flex-wrap: wrap;"></div>
                </div>
                <div id="inspectorDateSubheading" class="text-subtle text-xs" style="margin-top: 4px;">
                  Detailed chronological allocation for this date.
                </div>
              </div>
              <div style="display: flex; gap: var(--space-2); align-items: center;">
                <button id="inspectorOpenTodayBtn" class="btn btn-primary btn-sm">
                  ⚡ Open in Today Execution
                </button>
                <button id="inspectorCloseBtn" class="btn btn-outline btn-sm" aria-label="Close Inspector">
                  ✕
                </button>
              </div>
            </div>
            <div id="inspectorContent" style="padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2);">
              <!-- Populated dynamically -->
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { checkAuth } from "../assets/js/auth.js";
      import { renderLayout } from "../assets/js/nav.js";
      import { api } from "../assets/js/api.js";
      import { getTodayString, formatTime12 } from "../assets/js/utils.js";
      import { showToast } from "../assets/js/toast.js";

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      // Make escapeHtml globally available to avoid ReferenceError in async callbacks
      window.escapeHtml = escapeHtml;

      let currentYear = 2026;
      let currentMonth = 10; // 0-indexed: 10 is November
      let selectedDate = null;
      let tasksMap = {};
      let examsMap = {};
      let prepDatesMap = {};
      let assignmentsMap = {};
      let slackDaysMap = {};
      let exceptionsMap = {};
      let hackathonsMap = {};
      let activitiesMap = {};
      let coursesMap = {};
      let dailyPlansMap = {};
      let activationsMap = {};
      let templatesMap = {};
      let executionRecordsMap = {};
      let monthTargetSummary = null;

      function getAcademicBlocksForDate(dateStr) {
        const dayActivation = activationsMap[dateStr];
        const dayPlan = dailyPlansMap[dateStr];
        const dayExc = exceptionsMap[dateStr];
        let profileKey = null;
        if (dayActivation) profileKey = dayActivation.profileId;
        else if (dayExc && dayExc.templateOverride) profileKey = dayExc.templateOverride;
        else if (dayPlan && dayPlan.activeProfile) profileKey = dayPlan.activeProfile;
        else {
          const [y, m, d] = dateStr.split("-").map(Number);
          const dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
          profileKey = dow === 0 ? "sunday" : dow === 6 ? "saturday" : "weekday";
        }
        const tmpl = templatesMap[profileKey];
        if (!tmpl || !Array.isArray(tmpl.blocks)) return [];
        return tmpl.blocks.filter(
          (b) => b.category === "academics" || b.courseSlug === "academics" || b.blockType === "academics"
        );
      }

      async function init() {
        const user = await checkAuth();
        if (!user) return;
        renderLayout("calendar");

        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        selectedDate = getTodayString();

        await loadEvents();
        renderCalendar();
        setupEvents();
      }

      async function loadEvents() {
        try {
          const monthPad = String(currentMonth + 1).padStart(2, "0");
          const monthKey = `${currentYear}-${monthPad}`;
          const res = await api.get("/planner/calendar-events", {
            month: monthKey,
          });

          tasksMap = {};
          examsMap = {};
          prepDatesMap = {};
          assignmentsMap = {};
          slackDaysMap = {};
          exceptionsMap = {};
          hackathonsMap = {};
          activitiesMap = {};
          coursesMap = {};
          dailyPlansMap = {};
          templatesMap = {};
          executionRecordsMap = {};
          monthTargetSummary = res.monthTargetSummary || null;

          if (res.success) {
            (res.templates || []).forEach((t) => {
              if (t.dayType) templatesMap[t.dayType] = t;
            });

            (res.dailyPlans || []).forEach((dp) => {
              if (dp.date) dailyPlansMap[dp.date] = dp;
            });

            (res.courses || []).forEach((c) => {
              coursesMap[c.slug] = c;
            });

            (res.curriculumActivities || []).forEach((a) => {
              const d = a.scheduledDate || (a.completedDate ? a.completedDate.slice(0, 10) : null);
              if (d) {
                activitiesMap[d] = activitiesMap[d] || [];
                activitiesMap[d].push(a);
              }
            });

            (res.hackathons || []).forEach((h) => {
              if (h.startDate && h.endDate) {
                let cur = new Date(h.startDate);
                const end = new Date(h.endDate);
                while (cur <= end) {
                  const dStr = cur.toISOString().slice(0, 10);
                  hackathonsMap[dStr] = hackathonsMap[dStr] || [];
                  hackathonsMap[dStr].push(h);
                  cur.setDate(cur.getDate() + 1);
                }
              } else if (h.startDate) {
                hackathonsMap[h.startDate] = hackathonsMap[h.startDate] || [];
                hackathonsMap[h.startDate].push(h);
              }
            });

            (res.tasks || []).forEach((t) => {
              const d = t.scheduledDate || t.deadline;
              if (d) {
                tasksMap[d] = tasksMap[d] || [];
                tasksMap[d].push(t);
              }
            });

            (res.exams || []).forEach((e) => {
              if (e.examDate) {
                examsMap[e.examDate] = examsMap[e.examDate] || [];
                examsMap[e.examDate].push(e);
              }
              (e.preparationDates || []).forEach((pd) => {
                if (pd.date) {
                  prepDatesMap[pd.date] = prepDatesMap[pd.date] || [];
                  prepDatesMap[pd.date].push({
                    ...pd,
                    subjectName: e.subjectName,
                  });
                }
              });
            });

            (res.assignments || []).forEach((a) => {
              if (a.dueDate) {
                assignmentsMap[a.dueDate] = assignmentsMap[a.dueDate] || [];
                assignmentsMap[a.dueDate].push(a);
              }
            });

            (res.slackLogs || []).forEach((sl) => {
              if (sl.date) {
                slackDaysMap[sl.date] = sl;
              }
            });

            (res.exceptions || []).forEach((exc) => {
              if (exc.date) {
                exceptionsMap[exc.date] = exc;
              }
            });

            activationsMap = {};
            (res.activations || []).forEach((act) => {
              if (act.startDate && act.endDate) {
                const [y1, m1, d1] = act.startDate.split("-").map(Number);
                const [y2, m2, d2] = act.endDate.split("-").map(Number);
                let cur = new Date(Date.UTC(y1, m1 - 1, d1));
                const end = new Date(Date.UTC(y2, m2 - 1, d2));
                while (cur <= end) {
                  const dStr = cur.toISOString().slice(0, 10);
                  if (!activationsMap[dStr]) {
                    activationsMap[dStr] = act;
                  }
                  cur.setUTCDate(cur.getUTCDate() + 1);
                }
              }
            });

            (res.executionRecords || []).forEach((r) => {
              if (r.date) {
                executionRecordsMap[r.date] = executionRecordsMap[r.date] || [];
                executionRecordsMap[r.date].push(r);
              }
            });
          }
        } catch (err) {
          showToast(err.message, "error");
        }
      }

      function renderTargetSummary() {
        const bar = document.getElementById("monthTargetSummaryBar");
        if (!monthTargetSummary) {
          bar.style.display = "none";
          return;
        }

        bar.style.display = "grid";
        const {
          plannedLectures = 0,
          completedLectures = 0,
          lectureCompletionRate = 0,
          plannedHours = 0,
          completedHours = 0,
          hourCompletionRate = 0,
          activeCoursesCount = 0,
        } = monthTargetSummary;

        document.getElementById("targetSummaryLectures").textContent = `${completedLectures} / ${plannedLectures}`;
        document.getElementById("targetSummaryLecturesPct").textContent = `(${lectureCompletionRate}%)`;
        document.getElementById("targetSummaryLecturesBar").style.width = `${Math.min(100, lectureCompletionRate)}%`;

        document.getElementById("targetSummaryHours").textContent = `${completedHours}h / ${plannedHours}h`;
        document.getElementById("targetSummaryHoursPct").textContent = `(${hourCompletionRate}%)`;
        document.getElementById("targetSummaryHoursBar").style.width = `${Math.min(100, hourCompletionRate)}%`;

        document.getElementById("targetSummaryCourses").textContent = String(activeCoursesCount);
      }

      function renderCalendar() {
        renderTargetSummary();

        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        document.getElementById("currentMonthYearLabel").textContent =
          `${monthNames[currentMonth]} ${currentYear}`;

        const grid = document.getElementById("calendarGrid");
        grid.innerHTML = `
        <div class="cal-header-cell">Sun</div>
        <div class="cal-header-cell">Mon</div>
        <div class="cal-header-cell">Tue</div>
        <div class="cal-header-cell">Wed</div>
        <div class="cal-header-cell">Thu</div>
        <div class="cal-header-cell">Fri</div>
        <div class="cal-header-cell">Sat</div>
      `;

        const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0,
        ).getDate();
        const todayStr = getTodayString();

        // Pad previous month days
        const daysInPrevMonth = new Date(
          currentYear,
          currentMonth,
          0,
        ).getDate();
        for (let i = firstDayOfMonth - 1; i >= 0; i--) {
          const dayNum = daysInPrevMonth - i;
          grid.innerHTML += `<div class="cal-day-cell other-month"><div class="cal-date-num">${dayNum}</div></div>`;
        }

        // Current month days
        for (let d = 1; d <= daysInMonth; d++) {
          const monthPad = String(currentMonth + 1).padStart(2, "0");
          const dayPad = String(d).padStart(2, "0");
          const dateKey = `${currentYear}-${monthPad}-${dayPad}`;

          const isToday = dateKey === todayStr;
          const isSelected = dateKey === selectedDate;
          const dayTasks = tasksMap[dateKey] || [];
          const dayExams = examsMap[dateKey] || [];
          const dayPreps = prepDatesMap[dateKey] || [];
          const dayAssignments = assignmentsMap[dateKey] || [];
          const daySlack = slackDaysMap[dateKey];
          const dayExc = exceptionsMap[dateKey];
          const dayHackathons = hackathonsMap[dateKey] || [];
          const dayActs = activitiesMap[dateKey] || [];

          const allPills = [];

          // Authoritative Server-Allocated Course Plans (Direct API data, NO client calculation)
          const dayPlan = dailyPlansMap[dateKey];

          // Show activated timetable profile name if date is inside an activated range, or "Assumed" if beyond confirmed ranges
          const dayActivation = activationsMap[dateKey];
          const activeProfile = dayActivation ? dayActivation.profileId : dayPlan?.activeProfile;
          const isConfirmed = Boolean(dayActivation || dayExc || dayPlan?.isConfirmedSchedule);
          if (activeProfile && !["weekday", "saturday", "sunday"].includes(activeProfile)) {
            const isExam = activeProfile === "exam";
            const icon = isExam ? "🎓 " : activeProfile === "holiday" ? "🏖️ " : "📅 ";
            const label = isExam ? "Exam Schedule" : String(activeProfile).toUpperCase();
            allPills.push(`<div class="cal-event-pill ${isExam ? 'exam' : 'holiday'}" style="font-weight: 700;" title="Active Timetable Profile: ${activeProfile}">${icon}${label}</div>`);
          } else if (!isConfirmed && dateKey >= todayStr) {
            allPills.push(`<div class="cal-event-pill" style="background: rgba(100, 116, 139, 0.08); color: #64748b; border: 1px dashed rgba(100, 116, 139, 0.35); font-size: 0.68rem;" title="Schedule assumed from weekday/Sat/Sun defaults, not yet confirmed">Assumed default</div>`);
          }

          if (daySlack) {
            allPills.push(`<div class="cal-event-pill slack" title="Slack Day">🌿 Slack Day</div>`);
          }
          if (dayExc) {
            allPills.push(`<div class="cal-event-pill holiday" title="Schedule Override">🎯 ${String(dayExc.exceptionType || "Holiday").replace("_", " ")}</div>`);
          }

          dayHackathons.forEach((h) => {
            allPills.push(`<div class="cal-event-pill hackathon" title="Hackathon Sprint">🚀 ${h.name}</div>`);
          });

          dayExams.forEach((e) => {
            const timeStr = e.startTime
              ? ` @ ${formatTime12(e.startTime)}`
              : "";
            allPills.push(`<div class="cal-event-pill exam" title="${e.subjectName} (${e.examType})${timeStr}">🎓 ${e.subjectName} (${e.examType})${timeStr}</div>`);
          });

          dayPreps.forEach((p) => {
            allPills.push(`<div class="cal-event-pill exam-prep" title="Prep: ${p.subjectName}">📖 Prep: ${p.subjectName}</div>`);
          });

          dayAssignments.forEach((a) => {
            allPills.push(`<div class="cal-event-pill assignment" title="Due: ${a.title}">📝 Due: ${a.title}</div>`);
          });

          if (dayPlan && Array.isArray(dayPlan.coursePlans) && dayPlan.coursePlans.length > 0) {
            dayPlan.coursePlans.forEach((cp) => {
              const prefix = cp.category === "oratory" ? "🎙️ " : cp.category === "exploration" ? "⚡ " : "📚 ";
              const carryBadge = cp.carryoverMin > 0 ? ` (+${cp.carryoverMin}m carryover)` : "";
              allPills.push(`<div class="cal-event-pill lecture" style="background: rgba(14, 165, 233, 0.12); color: #0284c7; border: 1px solid rgba(14, 165, 233, 0.4);" title="${cp.courseTitle}: ${cp.effortMinTarget}m effort (${cp.lectureMinTarget}m lecture) · ${cp.startPosition} ➔ ${cp.endPosition}${carryBadge}">
                ${prefix}${cp.courseTitle} (${cp.endPosition}, ${cp.effortMinTarget}m)
              </div>`);
            });
          } else if (!dayPlan && activeProfile !== "exam" && dayActs.length > 0) {
            // Group fallback activities by course so individual sub-tasks don't spam +22 MORE
            const actsByCourse = {};
            dayActs.forEach((act) => {
              const slug = act.courseSlug || "general";
              if (!actsByCourse[slug]) actsByCourse[slug] = [];
              actsByCourse[slug].push(act);
            });
            Object.entries(actsByCourse).forEach(([slug, acts]) => {
              const c = coursesMap[slug];
              const prefix = c ? `${c.emoji || "📚"} ` : "📚 ";
              const totalMins = acts.reduce((acc, a) => acc + (a.allocatedMinutes || a.totalEffortMinutes || 30), 0);
              const title = c ? c.title : acts[0].title;
              const allDone = acts.every((a) => a.status === "completed");
              allPills.push(`<div class="cal-event-pill lecture" title="${prefix}${title} (${acts.length} items, ${totalMins}m)">${allDone ? "✓ " : ""}${prefix}${title} (${acts.length} items, ${totalMins}m)</div>`);
            });
          }

          // Tasks (skip academic checklist tasks already rendered above)
          dayTasks.filter((t) => t.category !== "academic").forEach((t) => {
            const p1Class = t.priority === "P1" ? "p1" : "";
            allPills.push(`<div class="cal-event-pill ${p1Class}" title="${t.title}">${t.title}</div>`);
          });

          const MAX_VISIBLE_PILLS = 3;
          let eventsHtml = allPills.slice(0, MAX_VISIBLE_PILLS).join("");
          if (allPills.length > MAX_VISIBLE_PILLS) {
            const extraCount = allPills.length - MAX_VISIBLE_PILLS;
            eventsHtml += `<div class="text-subtle text-xs" style="font-weight: 600; color: var(--color-muted); padding: 1px 2px;">+${extraCount} more</div>`;
          }

          const cellClasses = [
            "cal-day-cell",
            isToday ? "today" : "",
            isSelected ? "selected-day" : "",
          ].filter(Boolean).join(" ");

          grid.innerHTML += `
          <div class="${cellClasses}" data-date="${dateKey}" title="Click to inspect ${dateKey} schedule (Double click to open Today)">
            <div class="cal-date-num">${d}</div>
            ${eventsHtml}
          </div>
        `;
        }

        // Wire day-click selection & double click navigation
        grid
          .querySelectorAll(".cal-day-cell:not(.other-month)")
          .forEach((cell) => {
            cell.addEventListener("click", () => {
              const date = cell.dataset.date;
              if (date) {
                selectedDate = date;
                grid.querySelectorAll(".cal-day-cell").forEach((c) => c.classList.remove("selected-day"));
                cell.classList.add("selected-day");
                renderDayInspector(date);
              }
            });

            cell.addEventListener("dblclick", () => {
              const date = cell.dataset.date;
              if (date) {
                window.location.href = `dashboard.html?date=${date}`;
              }
            });
          });

        if (selectedDate) {
          renderDayInspector(selectedDate);
        }
      }

      function renderDayInspector(dateStr) {
        const inspector = document.getElementById("dayScheduleInspector");
        if (!dateStr) {
          inspector.style.display = "none";
          return;
        }

        inspector.style.display = "block";

        const parsedDate = new Date(`${dateStr}T00:00:00`);
        const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
        const formattedDate = parsedDate.toLocaleDateString("en-US", options);

        document.getElementById("inspectorDateHeading").textContent = formattedDate;

        const badgesContainer = document.getElementById("inspectorBadges");
        badgesContainer.innerHTML = "";

        const isToday = dateStr === getTodayString();
        if (isToday) {
          badgesContainer.innerHTML += `<span class="badge badge-primary">Today</span>`;
        }

        const daySlack = slackDaysMap[dateStr];
        if (daySlack) {
          badgesContainer.innerHTML += `<span class="badge badge-success">🌿 Slack Day</span>`;
        }

        const dayExc = exceptionsMap[dateStr];
        if (dayExc) {
          badgesContainer.innerHTML += `<span class="badge badge-blue">🎯 ${String(dayExc.exceptionType || "Holiday").replace("_", " ")}</span>`;
        }

        const dayHackathons = hackathonsMap[dateStr] || [];
        if (dayHackathons.length > 0) {
          badgesContainer.innerHTML += `<span class="badge" style="background:#f3e8ff;color:#7e22ce;">🚀 Hackathon Sprint</span>`;
        }

        const dayExams = examsMap[dateStr] || [];
        if (dayExams.length > 0) {
          badgesContainer.innerHTML += `<span class="badge badge-danger">🎓 Exam Day</span>`;
        }

        const content = document.getElementById("inspectorContent");
        content.innerHTML = "";

        let itemsCount = 0;

        // 1. Hackathons
        dayHackathons.forEach((h) => {
          itemsCount++;
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid #9333ea; background: #faf5ff;">
              <div>
                <strong>🚀 ${h.name}</strong>
                <div class="text-xs text-muted">Hackathon 24h Sprint mode active — normal lectures held without penalties</div>
              </div>
              <span class="badge badge-neutral">Hackathon</span>
            </div>
          `;
        });

        // 2. Exams
        dayExams.forEach((e) => {
          itemsCount++;
          const time = e.startTime ? `@ ${formatTime12(e.startTime)}` : "";
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid #dc2626; background: #fee2e2;">
              <div>
                <strong style="color: #991b1b;">🎓 ${e.subjectName} (${e.examType}) ${time}</strong>
                <div class="text-xs text-muted">${e.syllabusDescription || "Official Examination"}</div>
              </div>
              <span class="badge badge-danger">Examination</span>
            </div>
          `;
        });

        // 3. Exam Prep
        const dayPreps = prepDatesMap[dateStr] || [];
        dayPreps.forEach((p) => {
          itemsCount++;
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid #ea580c; background: #ffedd5;">
              <div>
                <strong style="color: #9a3412;">📖 Prep Revision: ${p.subjectName}</strong>
                <div class="text-xs text-muted">${p.topicsToRevise ? "Topics: " + p.topicsToRevise : "Planned revision session"}</div>
              </div>
              <span class="badge badge-neutral">Exam Prep</span>
            </div>
          `;
        });

        // 4. Server-Allocated Course Plans (Direct API data, NO client calculation)
        const dayPlanForInspector = dailyPlansMap[dateStr];
        const inspectorProfile = activationsMap[dateStr]?.profileId || dayPlanForInspector?.activeProfile;
        if (dayPlanForInspector && Array.isArray(dayPlanForInspector.coursePlans) && dayPlanForInspector.coursePlans.length > 0) {
          dayPlanForInspector.coursePlans.forEach((cp) => {
            itemsCount++;
            const isOratory = cp.category === "oratory" || cp.courseSlug === "oratory";
            const prefix = isOratory ? "🎙️ " : cp.category === "exploration" ? "⚡ " : "📚 ";
            const carryTag = cp.carryoverMin > 0 ? `<span class="badge badge-warning" style="margin-left: 6px;">+${cp.carryoverMin}m carryover first</span>` : "";
            const defaultTag = cp.source && cp.source !== "timetable" ? `<span class="badge badge-neutral" style="margin-left: 6px;">${escapeHtml(cp.source)}</span>` : "";

            content.innerHTML += `
              <div class="inspector-item" style="border-left: 3px solid ${isOratory ? '#9333ea' : '#0284c7'}; background: #f0f9ff;">
                <div>
                  <div style="font-size: 0.75rem; color: #0369a1; font-weight: 600;">
                    ${prefix}${cp.courseTitle} • ${cp.category.toUpperCase()}
                    ${carryTag}
                    ${defaultTag}
                  </div>
                  <strong style="color: var(--color-ink);">Target: ${cp.startPosition} ➔ ${cp.endPosition}</strong>
                  <div class="text-xs text-muted">
                    Effort Target: <strong>${cp.effortMinTarget}m</strong> · Lecture Target: <strong>${cp.lectureMinTarget}m</strong>
                    ${cp.endPositionLabel ? ` (${cp.endPositionLabel})` : ""}
                  </div>
                  ${Array.isArray(cp.lectureBreakdown) && cp.lectureBreakdown.length > 0 ? `
                    <div style="margin-top: 4px; font-size: 0.75rem; color: #0369a1;">
                      ${cp.lectureBreakdown.map(lb => `<div>• <strong>Lec ${lb.lectureNumber}: ${lb.title}</strong> (${lb.videoMinutes}m video / ${lb.effortMinutes}m effort)</div>`).join("")}
                    </div>
                  ` : ""}
                </div>
                <div>
                  <span class="badge ${cp.status === 'completed' ? 'badge-success' : 'badge-primary'}">${cp.status === 'completed' ? '✓ Completed' : 'Planned'}</span>
                </div>
              </div>
            `;
          });
        } else if (!dayPlanForInspector && inspectorProfile !== "exam") {
          // Fallback to discrete activities if no coursePlan generated
          const dayActs = activitiesMap[dateStr] || [];
          dayActs.forEach((act) => {
            itemsCount++;
            const c = coursesMap[act.courseSlug];
            const courseLabel = c ? `${c.emoji || "📚"} ${c.title}` : "📚 Course";
            const isDone = act.status === "completed";
            const duration = act.totalEffortMinutes || Math.round((act.contentDurationMinutes || 0) * (act.effectiveMultiplier || 2)) || 45;

            content.innerHTML += `
              <div class="inspector-item" style="border-left: 3px solid #0284c7; background: #f0f9ff;">
                <div>
                  <div style="font-size: 0.75rem; color: #0369a1; font-weight: 600;">${courseLabel} • Section ${act.sectionNumber || 1}</div>
                  <strong style="color: var(--color-ink);">${act.title}</strong>
                  <div class="text-xs text-muted">${duration} min planned effort</div>
                </div>
                <div>
                  ${
                    isDone
                      ? '<span class="badge badge-success">✓ Completed</span>'
                      : '<span class="badge badge-neutral">Pending</span>'
                  }
                </div>
              </div>
            `;
          });
        }

        // 5. Assignments
        const dayAssignments = assignmentsMap[dateStr] || [];
        dayAssignments.forEach((a) => {
          itemsCount++;
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid #7c3aed; background: #f5f3ff;">
              <div>
                <strong style="color: #6d28d9;">📝 Assignment Due: ${a.title}</strong>
                <div class="text-xs text-muted">Estimated: ${a.estimatedMinutes || 60}m</div>
              </div>
              <span class="badge badge-neutral">${a.status || "Pending"}</span>
            </div>
          `;
        });

        // 6. Tasks
        const dayTasks = tasksMap[dateStr] || [];
        dayTasks.forEach((t) => {
          itemsCount++;
          const isDone = t.status === "completed";
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid var(--color-primary);">
              <div>
                <strong>${t.title}</strong>
                <div class="text-xs text-muted">${t.estimatedMinutes || 30}m • Priority: ${t.priority || "P2"}</div>
              </div>
              <div>
                ${
                  isDone
                    ? '<span class="badge badge-success">✓ Completed</span>'
                    : '<span class="badge badge-neutral">To Do</span>'
                }
              </div>
            </div>
          `;
        });

        // 7. Execution Records
        const dayLogs = executionRecordsMap[dateStr] || [];
        dayLogs.forEach((rec) => {
          itemsCount++;
          content.innerHTML += `
            <div class="inspector-item" style="border-left: 3px solid #10b981; background: #ecfdf5;">
              <div>
                <strong style="color: #047857;">⏱️ Logged Session: ${rec.minutesSpent}m</strong>
                <div class="text-xs text-muted">${rec.notes || "Execution activity verified"}</div>
              </div>
              <span class="badge badge-success">Logged</span>
            </div>
          `;
        });

        if (itemsCount === 0) {
          content.innerHTML = `
            <div class="text-subtle text-sm" style="padding: var(--space-4); text-align: center;">
              No lectures, exams, hackathons, or tasks scheduled for ${formattedDate}.
            </div>
          `;
        }

        const openBtn = document.getElementById("inspectorOpenTodayBtn");
        openBtn.onclick = () => {
          window.location.href = `dashboard.html?date=${dateStr}`;
        };

        const closeBtn = document.getElementById("inspectorCloseBtn");
        closeBtn.onclick = () => {
          inspector.style.display = "none";
          document.querySelectorAll(".cal-day-cell").forEach((c) => c.classList.remove("selected-day"));
        };
      }

      function setupEvents() {
        document
          .getElementById("prevMonthBtn")
          .addEventListener("click", async () => {
            currentMonth--;
            if (currentMonth < 0) {
              currentMonth = 11;
              currentYear--;
            }
            await loadEvents();
            renderCalendar();
          });

        document
          .getElementById("nextMonthBtn")
          .addEventListener("click", async () => {
            currentMonth++;
            if (currentMonth > 11) {
              currentMonth = 0;
              currentYear++;
            }
            await loadEvents();
            renderCalendar();
          });

        document
          .getElementById("todayBtn")
          .addEventListener("click", async () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            selectedDate = getTodayString();
            await loadEvents();
            renderCalendar();
          });
      }

      init();
    </script>
  </body>
</html>
