<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Session — SARTHI (सारथी)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/typography.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <style>
    .timer-display {
      font-size: 5rem;
      font-weight: 800;
      color: var(--color-ink);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: var(--space-6) 0;
      letter-spacing: -0.04em;
    }
    .timer-card {
      text-align: center;
      padding: var(--space-12) var(--space-8);
      max-width: 640px;
      margin: 0 auto var(--space-8);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
          <div class="page-headline">Deep Work & Focus Timer</div>
        </div>
        <div class="topbar-right">
          <div id="topbarFocusWidget"></div>
        </div>
      </header>

      <div class="page-container">
        <!-- Main Timer Card -->
        <div class="card timer-card">
          <div class="text-xs" style="color: var(--color-primary); font-weight: 800; letter-spacing: 0.1em;" id="sessionStatusBadge">
            READY TO FOCUS
          </div>

          <h2 id="sessionTitleDisplay" style="font-size: 1.5rem; margin-top: var(--space-2);">
            No Active Session
          </h2>

          <div class="timer-display" id="timerClock">25:00</div>

          <!-- Controls when inactive -->
          <div id="inactiveControls" style="display: block;">
            <div style="max-width: 380px; margin: 0 auto var(--space-6); text-align: left;">
              <div class="form-group">
                <label class="form-label">Focus Activity / Task Title</label>
                <input type="text" id="focusTitleInput" class="form-input" placeholder="e.g. C++ Binary Trees or Chai aur Code DOM" required>
              </div>
              <div class="form-group">
                <label class="form-label">Target Duration (Minutes)</label>
                <div style="display: flex; gap: var(--space-2);">
                  <button type="button" class="btn btn-outline btn-sm duration-btn" data-min="25">25m</button>
                  <button type="button" class="btn btn-outline btn-sm duration-btn" data-min="45">45m</button>
                  <button type="button" class="btn btn-outline btn-sm duration-btn" data-min="60">60m</button>
                  <button type="button" class="btn btn-outline btn-sm duration-btn" data-min="90">90m</button>
                  <input type="number" id="customDurationInput" class="form-input" value="25" min="5" style="width: 80px;">
                </div>
              </div>
            </div>
            <button id="startTimerBtn" class="btn btn-primary" style="padding: 0.75rem 2.5rem; font-size: 1.125rem;">
              ▶ Begin Focus Session
            </button>
          </div>

          <!-- Controls when active or paused -->
          <div id="activeControls" style="display: none;">
            <div style="display: flex; justify-content: center; gap: var(--space-4);">
              <button id="pauseTimerBtn" class="btn btn-secondary" style="padding: 0.625rem 1.75rem;">
                ⏸ Pause
              </button>
              <button id="resumeTimerBtn" class="btn btn-primary" style="padding: 0.625rem 1.75rem; display: none;">
                ▶ Resume
              </button>
              <button id="completeTimerBtn" class="btn btn-outline" style="border-color: var(--color-success); color: var(--color-success); font-weight: 700;">
                ✓ Complete & Log
              </button>
              <button id="cancelTimerBtn" class="btn btn-outline" style="color: var(--color-danger);">
                Cancel
              </button>
            </div>
          </div>
        </div>

        <!-- Session History Table -->
        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <div class="card-header">
            <div class="card-title">Recent Completed Focus Sessions</div>
            <div class="text-subtle text-sm" id="totalFocusMinutes">- min total</div>
          </div>
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Session Activity</th>
                  <th>Actual Duration</th>
                  <th>Target</th>
                  <th>Date & Time</th>
                </tr>
              </thead>
              <tbody id="historyTbody">
                <tr><td colspan="4" style="text-align: center;">Loading history...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { checkAuth } from '../assets/js/auth.js';
    import { renderLayout } from '../assets/js/nav.js';
    import { api } from '../assets/js/api.js';
    import { formatMinutes } from '../assets/js/utils.js';
    import { showToast } from '../assets/js/toast.js';

    let activeSession = null;
    let timerInterval = null;
    let linkedTaskId = null;

    async function init() {
      const user = await checkAuth();
      if (!user) return;
      renderLayout('focus');

      // Check query params if redirected from a specific task or learning track
      const params = new URLSearchParams(window.location.search);
      if (params.get('title')) {
        document.getElementById('focusTitleInput').value = params.get('title');
      }
      if (params.get('taskId')) {
        linkedTaskId = params.get('taskId');
        if (!params.get('title')) {
          document.getElementById('focusTitleInput').value = 'Task execution';
        }
      }

      await checkActiveSession();
      await loadHistory();
      setupEvents();
    }

    async function checkActiveSession() {
      try {
        const res = await api.get('/focus/active');
        if (res.active && res.session) {
          activeSession = res.session;
          renderActiveState();
        } else {
          renderInactiveState();
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderActiveState() {
      document.getElementById('inactiveControls').style.display = 'none';
      document.getElementById('activeControls').style.display = 'block';

      document.getElementById('sessionTitleDisplay').textContent = activeSession.title;
      const isPaused = activeSession.status === 'paused';

      document.getElementById('sessionStatusBadge').textContent = isPaused ? 'SESSION PAUSED' : 'FOCUS IN PROGRESS';
      document.getElementById('sessionStatusBadge').style.color = isPaused ? 'var(--color-warning)' : 'var(--color-primary)';

      document.getElementById('pauseTimerBtn').style.display = isPaused ? 'none' : 'inline-flex';
      document.getElementById('resumeTimerBtn').style.display = isPaused ? 'inline-flex' : 'none';

      startLocalClock();
    }

    function renderInactiveState() {
      if (timerInterval) clearInterval(timerInterval);
      document.getElementById('inactiveControls').style.display = 'block';
      document.getElementById('activeControls').style.display = 'none';
      document.getElementById('sessionStatusBadge').textContent = 'READY TO FOCUS';
      document.getElementById('sessionStatusBadge').style.color = 'var(--color-primary)';
      document.getElementById('sessionTitleDisplay').textContent = 'No Active Session';
      document.getElementById('timerClock').textContent = '25:00';
    }

    function startLocalClock() {
      if (timerInterval) clearInterval(timerInterval);

      function update() {
        if (!activeSession) return;
        const now = new Date();
        const start = new Date(activeSession.startTime);
        
        let totalElapsedMs = now - start;
        for (const p of (activeSession.pauses || [])) {
          if (p.pausedAt) {
            const res = p.resumedAt ? new Date(p.resumedAt) : (activeSession.status === 'paused' ? now : new Date(p.pausedAt));
            totalElapsedMs -= (res - new Date(p.pausedAt));
          }
        }

        const elapsedSec = Math.max(0, Math.floor(totalElapsedMs / 1000));
        const targetSec = (activeSession.targetMinutes || 25) * 60;
        const remainingSec = Math.max(0, targetSec - elapsedSec);

        const m = Math.floor(remainingSec / 60);
        const s = remainingSec % 60;
        document.getElementById('timerClock').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      update();
      if (activeSession.status === 'active') {
        timerInterval = setInterval(update, 1000);
      }
    }

    function setupEvents() {
      document.querySelectorAll('.duration-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('customDurationInput').value = btn.dataset.min;
        });
      });

      document.getElementById('startTimerBtn').addEventListener('click', async () => {
        const title = document.getElementById('focusTitleInput').value.trim() || 'Unassigned Focus Session';
        const targetMinutes = Number(document.getElementById('customDurationInput').value) || 25;

        try {
          const res = await api.post('/focus/start', {
            title,
            targetMinutes,
            taskId: linkedTaskId
          });

          if (res.success && res.session) {
            activeSession = res.session;
            showToast('Focus session started! Deep work begins now.', 'success');
            renderActiveState();
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('pauseTimerBtn').addEventListener('click', async () => {
        try {
          const res = await api.post('/focus/pause', {});
          if (res.success && res.session) {
            activeSession = res.session;
            renderActiveState();
            showToast('Session paused.');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('resumeTimerBtn').addEventListener('click', async () => {
        try {
          const res = await api.post('/focus/resume', {});
          if (res.success && res.session) {
            activeSession = res.session;
            renderActiveState();
            showToast('Session resumed.');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('completeTimerBtn').addEventListener('click', async () => {
        const notes = prompt('Any brief reflection or session note? (Optional)') || '';
        try {
          const res = await api.post('/focus/complete', { notes });
          if (res.success) {
            showToast(res.message, 'success');
            activeSession = null;
            renderInactiveState();
            await loadHistory();
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('cancelTimerBtn').addEventListener('click', async () => {
        if (!confirm('Cancel this focus session? Elapsed time will not be logged.')) return;
        try {
          await api.post('/focus/cancel', {});
          activeSession = null;
          renderInactiveState();
          showToast('Focus session cancelled.');
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }

    async function loadHistory() {
      try {
        const res = await api.get('/focus/history');
        if (!res.success) return;

        document.getElementById('totalFocusMinutes').textContent = `${formatMinutes(res.totalMinutes)} total focus time`;

        const tbody = document.getElementById('historyTbody');
        if (res.sessions.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--color-muted);">No focus sessions completed yet.</td></tr>';
          return;
        }

        tbody.innerHTML = res.sessions.map(s => `
          <tr>
            <td style="font-weight: 600;">${s.title}</td>
            <td><strong style="color: var(--color-primary);">${s.actualMinutes}m</strong></td>
            <td>${s.targetMinutes}m</td>
            <td class="text-subtle text-xs">${new Date(s.createdAt).toLocaleDateString()} ${new Date(s.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
          </tr>
        `).join('');
      } catch (err) {}
    }

    init();
  </script>
</body>
</html>
