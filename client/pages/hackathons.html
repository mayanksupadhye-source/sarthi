<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathons & Projects — SARTHI (सारथी)</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/typography.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
  <div class="app-layout">
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
          <div class="page-headline">Hackathon & Project Command Centre</div>
        </div>
        <div class="topbar-right">
          <div id="topbarFocusWidget"></div>
          <button id="addHackathonBtn" class="btn btn-primary btn-sm">+ Register Hackathon</button>
        </div>
      </header>

      <div class="page-container">
        <!-- Explainer -->
        <div class="card" style="margin-bottom: var(--space-6);">
          <h2 style="font-size: 1.25rem; margin-bottom: var(--space-1);">Project & Competition Execution</h2>
          <p class="text-subtle text-sm">
            Coordinate milestones, team member roles, deliverable deadlines, and weekly effort budgets without letting hackathons derail academic attendance or sleep windows.
          </p>
        </div>

        <!-- Hackathons List -->
        <div id="hackathonsList">
          <p class="text-muted text-sm">Loading hackathons...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Hackathon Modal -->
  <div id="hackathonModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="card-header">
        <div class="card-title">Register Hackathon</div>
        <button id="closeHackathonModal" class="btn btn-outline btn-sm">✕</button>
      </div>
      <form id="hackathonForm">
        <div class="form-group">
          <label class="form-label">Hackathon Title</label>
          <input type="text" id="hackTitle" class="form-input" placeholder="e.g. Smart India Hackathon / DevFolio Web3" required>
        </div>
        <div class="form-group">
          <label class="form-label">Project Tagline / Problem Statement</label>
          <input type="text" id="hackTagline" class="form-input" placeholder="e.g. Adaptive Student OS with AI Planner">
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Start Date</label>
            <input type="date" id="hackStart" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">End / Submission Date</label>
            <input type="date" id="hackEnd" class="form-input" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Current Stage</label>
            <select id="hackStage" class="form-select">
              <option value="registered">Registered</option>
              <option value="ideation">Ideation</option>
              <option value="proposal">Proposal / PPT</option>
              <option value="prototype">Prototype / Coding</option>
              <option value="demo">Demo / Video</option>
              <option value="pitch">Pitch & Presentation</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Weekly Effort Budget (Hours)</label>
            <input type="number" id="hackBudget" class="form-input" value="10" min="2" max="40">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Repository URL (GitHub)</label>
          <input type="url" id="hackRepo" class="form-input" placeholder="https://github.com/...">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4);">
          <button type="button" id="cancelHackBtn" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Hackathon</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { checkAuth } from '../assets/js/auth.js';
    import { renderLayout } from '../assets/js/nav.js';
    import { api } from '../assets/js/api.js';
    import { showToast } from '../assets/js/toast.js';

    async function init() {
      const user = await checkAuth();
      if (!user) return;
      renderLayout('hackathons');
      await loadHackathons();
      setupEvents();
    }

    async function loadHackathons() {
      try {
        const res = await api.get('/hackathons');
        if (!res.success) return;

        const container = document.getElementById('hackathonsList');
        if (res.hackathons.length === 0) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: var(--space-8);">
              <p class="text-muted" style="margin-bottom: var(--space-4);">No active hackathons or major projects tracked.</p>
              <button id="addFirstHackBtn" class="btn btn-primary btn-sm">+ Register First Hackathon</button>
            </div>
          `;
          document.getElementById('addFirstHackBtn')?.addEventListener('click', () => {
            document.getElementById('hackathonModal').classList.remove('hidden');
          });
          return;
        }

        container.innerHTML = res.hackathons.map(h => `
          <div class="card" style="margin-bottom: var(--space-6); border-left: 4px solid var(--color-ink);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4);">
              <div>
                <span class="badge badge-neutral" style="text-transform: uppercase;">${h.currentStage}</span>
                <h3 style="font-size: 1.25rem; margin-top: 4px;">${h.title}</h3>
                <p class="text-subtle text-sm">${h.tagline || 'Project coordination workspace'}</p>
                <div class="text-subtle text-xs" style="margin-top: var(--space-2);">
                  Dates: <strong>${h.startDate}</strong> to <strong>${h.endDate}</strong> · Weekly Budget: <strong>${h.weeklyEffortBudgetHours}h</strong>
                </div>
              </div>
              <div style="display: flex; gap: var(--space-2);">
                ${h.repoUrl ? `<a href="${h.repoUrl}" target="_blank" class="btn btn-outline btn-sm">GitHub ↗</a>` : ''}
                <button class="btn btn-outline btn-sm delete-hack-btn" data-id="${h._id}">Remove</button>
              </div>
            </div>

            <div style="margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--color-border);">
              <div class="text-xs" style="font-weight: 700; color: var(--color-muted); margin-bottom: var(--space-2);">STAGES & DELIVERABLES</div>
              <div class="grid-3">
                ${(h.stages || []).map(st => `
                  <div style="background: var(--color-bg-base); padding: var(--space-3); border-radius: var(--radius-sm);">
                    <div style="font-weight: 600; font-size: 0.8125rem;">${st.name}</div>
                    <span class="badge ${st.status === 'completed' ? 'badge-success' : 'badge-neutral'}" style="margin-top: 4px;">${st.status}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.delete-hack-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Remove this hackathon?')) return;
            try {
              await api.delete(`/hackathons/${btn.dataset.id}`);
              showToast('Hackathon removed.');
              await loadHackathons();
            } catch (err) {
              showToast(err.message, 'error');
            }
          });
        });
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function setupEvents() {
      document.getElementById('addHackathonBtn').addEventListener('click', () => {
        document.getElementById('hackathonModal').classList.remove('hidden');
      });
      document.getElementById('closeHackathonModal').addEventListener('click', () => {
        document.getElementById('hackathonModal').classList.add('hidden');
      });
      document.getElementById('cancelHackBtn').addEventListener('click', () => {
        document.getElementById('hackathonModal').classList.add('hidden');
      });

      document.getElementById('hackathonForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api.post('/hackathons', {
            title: document.getElementById('hackTitle').value,
            tagline: document.getElementById('hackTagline').value,
            startDate: document.getElementById('hackStart').value,
            endDate: document.getElementById('hackEnd').value,
            currentStage: document.getElementById('hackStage').value,
            weeklyEffortBudgetHours: document.getElementById('hackBudget').value,
            repoUrl: document.getElementById('hackRepo').value
          });

          showToast('Hackathon registered successfully!', 'success');
          document.getElementById('hackathonModal').classList.add('hidden');
          document.getElementById('hackathonForm').reset();
          await loadHackathons();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }

    init();
  </script>
</body>
</html>
